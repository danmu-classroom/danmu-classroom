name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    env:
      # The Electron binary is not needed for lint/typecheck/unit tests.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    name: Deploy Worker
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip when CLOUDFLARE_API_TOKEN is not configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN secret is not set; skipping deploy."
      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 24
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: corepack enable pnpm && pnpm install --frozen-lockfile --filter "@danmu/worker..."
      # Builds the browser scripts, applies D1 migrations, deploys.
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm --filter @danmu/worker run deploy
