name: Release screen

# Push a tag like `screen-v1.0.0` (matching apps/screen/package.json) to build the Electron
# screen on macOS, Windows and Linux and publish a GitHub Release with the installers.
on:
  push:
    tags: ['screen-v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      # electron-builder downloads the Electron build for each target itself.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Installers are not code-signed (no certificates); see apps/screen/README.md.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --filter "@danmu/screen..."
      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./apps/screen/package.json').version")
          [ "${GITHUB_REF_NAME}" = "screen-v${version}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != screen-v${version}"; exit 1; }
      - run: pnpm --filter @danmu/screen exec electron-vite build
      - run: pnpm --filter @danmu/screen exec electron-builder --${{ matrix.platform }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: screen-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            apps/screen/dist/*.dmg
            apps/screen/dist/*.zip
            apps/screen/dist/*.exe
            apps/screen/dist/*.AppImage

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#screen-v}
          {
            echo "彈幕教室螢幕 v${version}：連到新的 Cloudflare 伺服器，觀眾可用網頁或 LINE 送彈幕。"
            echo
            echo "## 下載"
            echo
            echo "- macOS（Apple Silicon）：\`danmu-classroom-screen-${version}-mac-arm64.dmg\`"
            echo "- macOS（Intel）：\`danmu-classroom-screen-${version}-mac-x64.dmg\`"
            echo "- Windows：\`danmu-classroom-screen-${version}-win-x64.exe\`（免安裝）"
            echo "- Linux：\`danmu-classroom-screen-${version}-linux-x86_64.AppImage\`"
            echo
            echo "安裝檔沒有簽章：macOS 第一次開啟若顯示「無法驗證開發者」，到「系統設定 → 隱私權與安全性」按「強制打開」；Windows 出現 SmartScreen 時按「其他資訊 → 仍要執行」。"
            echo
            echo "完整變更見 [CHANGELOG](https://github.com/danmu-classroom/danmu-classroom/blob/${GITHUB_REF_NAME}/apps/screen/CHANGELOG.md)。"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "彈幕教室螢幕 v${version}" \
            --notes-file notes.md \
            --latest
