name: Release screen

# Releases the Electron screen automatically: when `version` in apps/screen/package.json changes
# on main and there is no `screen-v<version>` release yet, this builds the installers on macOS,
# Windows and Linux and publishes a GitHub Release (which also creates the tag).
on:
  push:
    branches: [main]
    paths: ['apps/screen/package.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-screen
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Is there a release for this version yet?
        run: |
          version=$(node -p "require('./apps/screen/package.json').version")
          tag="screen-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} is already released; nothing to do."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing ${tag}."
          fi
      - uses: actions/setup-node@v7
        if: steps.version.outputs.release == 'true'
        with:
          node-version: 24
      - name: Test the screen before releasing
        if: steps.version.outputs.release == 'true'
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile --filter "@danmu/screen..."
          pnpm --filter "@danmu/screen..." typecheck
          pnpm --filter "@danmu/screen..." test

  build:
    name: Build (${{ matrix.platform }})
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      # electron-builder downloads the Electron build for each target itself.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Installers are not code-signed (no certificates); see apps/screen/README.md.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --filter "@danmu/screen..."
      - run: pnpm --filter @danmu/screen exec electron-vite build
      - run: pnpm --filter @danmu/screen exec electron-builder --${{ matrix.platform }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: screen-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            apps/screen/dist/*.dmg
            apps/screen/dist/*.zip
            apps/screen/dist/*.exe
            apps/screen/dist/*.AppImage

  release:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          version: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "彈幕教室螢幕 v${version}：連到新的 Cloudflare 伺服器，觀眾可用網頁或 LINE 送彈幕。"
            echo
            echo "## 下載"
            echo
            echo "- macOS（Apple Silicon）：\`danmu-classroom-screen-${version}-mac-arm64.dmg\`"
            echo "- macOS（Intel）：\`danmu-classroom-screen-${version}-mac-x64.dmg\`"
            echo "- Windows：\`danmu-classroom-screen-${version}-win-x64.exe\`（免安裝）"
            echo "- Linux：\`danmu-classroom-screen-${version}-linux-x86_64.AppImage\`"
            echo
            echo "安裝檔沒有簽章：macOS 第一次開啟若顯示「無法驗證開發者」，到「系統設定 → 隱私權與安全性」按「強制打開」；Windows 出現 SmartScreen 時按「其他資訊 → 仍要執行」。"
            echo
            echo "完整變更見 [CHANGELOG](https://github.com/danmu-classroom/danmu-classroom/blob/${TAG}/apps/screen/CHANGELOG.md)。"
          } > notes.md
          # Creates the tag on the commit that was built
          gh release create "$TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "彈幕教室螢幕 v${version}" \
            --notes-file notes.md \
            --latest
